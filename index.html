<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Git - SH Works</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-drag: none; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
    }
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header img {
      width: 80px;
      height: 80px;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a2e4a;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 8px;
      color: #64748b;
      font-size: 0.9rem;
    }
    .card-link {
      display: block;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 24px 28px;
      margin-bottom: 16px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s, transform 0.15s;
      border: 2px solid transparent;
    }
    .card-link:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
      transform: translateY(-2px);
      border-color: #c5d0fa;
    }
    .card-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a2e4a;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.6;
    }
    .card-arrow {
      float: right;
      font-size: 1.1rem;
      color: #c5d0fa;
      margin-top: -32px;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <img src="/sh_works_icon.png" alt="SH Works">
    <h1>👋 안녕하세요</h1>
    <p>이용할 서비스를 선택해 주세요.</p>
  </header>

  <a class="card-link" href="/meeting/">
    <div class="card-icon">📋</div>
    <div class="card-title">LG전자 회의록 PPT 생성기</div>
    <div class="card-desc">회의 내용을 입력하면 AI가 자동으로 분류하고 PPT 파일로 만들어 드립니다.</div>
    <div class="card-arrow">›</div>
  </a>
  <p style="text-align:center;margin-top:24px;font-size:0.78rem;color:#94a3b8;">Copyright 2026 SH Works. All rights reserved.</p>
</div>
<script>
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
</script>
</body>
</html>
